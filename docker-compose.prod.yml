# Production deployment.
#   Build & run:   docker compose -f docker-compose.prod.yml up -d --build
#   Stop:          docker compose -f docker-compose.prod.yml down
#
# Builds the dashboard to static assets and serves them with nginx (no Node
# runtime, no runtime npm install). Mock data is NOT included in production.
services:
  webapp:
    container_name: webapp-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        APP_ROUTE: ${APP_ROUTE:-./dashboard}
    image: node-nginx-clean-webapp:prod
    restart: unless-stopped
    ports:
      - ${HOST_HTTP_PORT:-80}:80
    networks:
      - node_network

  dbPostgres:
    image: postgres:latest
    container_name: dbPostgres
    restart: unless-stopped
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql:rw
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - node_network

networks:
  node_network:

volumes:
  postgres-data:
