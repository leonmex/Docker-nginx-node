# Production deployment — runs on the AWS EC2 instance (infra/terraform/
# environments/prod/ec2.tf), not locally. Images pulled from GHCR, not
# built here. No dbPostgres (RDS replaces it) — see
# docs/DEPLOY-TO-AWS-STEP-BY-STEP.md §4-6.
#
# Deployed via scripts/deploy-to-ec2.sh (assembles /opt/blablarags/.env from
# Secrets Manager, then `docker compose -f docker-compose.prod.yml up -d`).
#
#   Deploy:  docker compose -f docker-compose.prod.yml pull && \
#            docker compose -f docker-compose.prod.yml up -d
#   Stop:    docker compose -f docker-compose.prod.yml down
services:
  server:
    image: ghcr.io/leonmex/server-blablaragsandrigs:latest
    container_name: server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_SSL=true
    # Internal only — nginx reverse-proxies to it as http://server:5000. No host port.
    expose:
      - "5000"
    depends_on:
      - redis
    networks:
      - node_network

  # Dashboard — static SPA, served by its own internal nginx (see
  # dashboard/Dockerfile). Reverse-proxied by the `proxy` service as
  # webapp:80 (nginx/prod/admin.blablarags.com.conf).
  webapp:
    image: ghcr.io/leonmex/dashboard-blablaragsandrigs:latest
    container_name: webapp
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - node_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # t3.micro has 1GB RAM total — much tighter ceiling than dev's default
    # 256mb, shared with server/nginx/the OS on the same box.
    command:
      ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - node_network

  proxy:
    image: nginx:latest
    container_name: proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
      - webapp
    volumes:
      - ./nginx/prod:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/secrets:/etc/nginx/secrets:ro
    networks:
      - node_network

networks:
  node_network:

volumes:
  redis-data:
