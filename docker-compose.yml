#version: "3.8"
services:
  webapp:
    container_name: webapp
    build:
      context: .
      dockerfile: Dockerfile
      target: webapp
      args:
        APP_ROUTE: ${APP_ROUTE:-./dashboard}
    environment:
      - NGINX_HOST=webapp
      - NGINX_PORT=4321
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
    # Debugger bound to loopback only — not exposed publicly (security rule).
    # Host port overridable via HOST_DEBUG_PORT (see scripts/star-from-cero.sh,
    # which remaps it automatically if something else already holds 9229).
    ports:
      - 127.0.0.1:${HOST_DEBUG_PORT:-9229}:9229
    restart: unless-stopped
    # `npm run dev` = MOCK=none — Umi mock middleware disabled; /api/* is served
    # by the real backend via nginx (Phase 1 cutover).
    command: sh -c "npm install --ignore-scripts && npm run dev"
    volumes:
      - ${APP_ROUTE:-./dashboard}:/usr/src/app
      - webapp_node_modules:/usr/src/app/node_modules
    networks:
      - node_network

  proxy:
    container_name: proxy
    restart: unless-stopped
    image: nginx:latest
    # Host ports overridable via .env — see scripts/star-from-cero.sh, which
    # remaps any of these automatically if another process/project already
    # holds them (container-side ports must stay fixed: nginx/default.conf
    # hardcodes `listen 443/4321/3000`, it isn't env-substituted).
    ports:
      - ${HOST_HTTP_PORT:-80}:${NGINX_PORT:-80}
      - ${HOST_HTTPS_PORT:-443}:443
      - ${HOST_PROXY_PORT_4321:-4321}:4321
      - ${HOST_PROXY_PORT_3000:-3000}:3000
    depends_on:
      - webapp
      - server
      - minio
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - node_network

  dbPostgres:
    image: postgres:18.4
    # Bound to loopback only — not exposed on external interfaces (security rule).
    # Host port overridable via HOST_POSTGRES_PORT (see scripts/star-from-cero.sh).
    ports:
      - 127.0.0.1:${HOST_POSTGRES_PORT:-5432}:5432
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql:rw
    container_name: dbPostgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - node_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Loopback-only host binding; reachable as redis://redis:6379 inside the network.
    # Host port overridable via HOST_REDIS_PORT (see scripts/star-from-cero.sh).
    ports:
      - 127.0.0.1:${HOST_REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    networks:
      - node_network

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    # S3 API (9000) is internal only, reached by `server` as http://minio:9000
    # (same "no host port" pattern as `server` itself). Web console (9001) is
    # loopback-only for admin access, not exposed publicly.
    # Host port overridable via HOST_MINIO_CONSOLE_PORT (see scripts/star-from-cero.sh).
    ports:
      - 127.0.0.1:${HOST_MINIO_CONSOLE_PORT:-9001}:9001
    expose:
      - "9000"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - node_network

  server:
    image: node:22-alpine
    working_dir: /usr/src/server
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
      - DB_HOST=dbPostgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HOST=0.0.0.0
      - PORT=5000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-blablarags-apparel}
    # Internal only — nginx reverse-proxies to it as http://server:5000. No host port.
    expose:
      - "5000"
    # Runtime install (mirrors webapp), then start the Fastify API.
    command: sh -c "npm install --ignore-scripts && npm start"
    volumes:
      - ./server:/usr/src/server
      - server_node_modules:/usr/src/server/node_modules
    depends_on:
      - dbPostgres
      - redis
      - minio
      - mailhog
    networks:
      - node_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    # SMTP catcher for SmtpEmailService (system_settings smtp.host=mailhog,
    # smtp.port=1025, see db/migrations/0020_system_settings.sql) — internal
    # only, reached by `server` as mailhog:1025.
    expose:
      - "1025"
    # Web UI to inspect caught mail — loopback-only, same pattern as the
    # minio console (security rule: no admin UI exposed on a public interface).
    # Host port overridable via HOST_MAILHOG_PORT (see scripts/star-from-cero.sh).
    ports:
      - 127.0.0.1:${HOST_MAILHOG_PORT:-8025}:8025
    networks:
      - node_network

