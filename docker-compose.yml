networks:
  node_network:

volumes:
  postgres-data:
  redis-data:
  minio-data:
  # Local-disk fallback for TELEMETRY_LOG_NAS_DIR — used only in presentation/
  # standalone mode (see README_RUN_PRESENTATION.md), when there's no NAS
  # to bind-mount. Unused (and harmless) the rest of the time.
  server-logs-local:
  webapp_node_modules:
  server_node_modules:
  shop_node_modules:
  website_node_modules: # elasticsearch-data:
