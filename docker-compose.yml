#version: "3.8"
services:
  webapp:
    container_name: webapp
    build:
      context: .
      dockerfile: Dockerfile
      target: webapp
      args:
        APP_ROUTE: ${APP_ROUTE:-./dashboard}
    environment:
      - NGINX_HOST=webapp
      - NGINX_PORT=4321
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
    # Debugger bound to loopback only — not exposed publicly (security rule).
    # Host port overridable via HOST_DEBUG_PORT (see scripts/star-from-cero.sh,
    # which remaps it automatically if something else already holds 9229).
    ports:
      - 127.0.0.1:${HOST_DEBUG_PORT:-9229}:9229
    restart: unless-stopped
    # `npm run dev` = MOCK=none — Umi mock middleware disabled; /api/* is served
    # by the real backend via nginx (Phase 1 cutover).
    command: sh -c "npm install --ignore-scripts && npm run dev"
    volumes:
      - ${APP_ROUTE:-./dashboard}:/usr/src/app
      - webapp_node_modules:/usr/src/app/node_modules
    networks:
      - node_network

  proxy:
    container_name: proxy
    restart: unless-stopped
    image: nginx:latest
    # Host ports overridable via .env — see scripts/star-from-cero.sh, which
    # remaps any of these automatically if another process/project already
    # holds them (container-side ports must stay fixed: nginx/default.conf
    # hardcodes `listen 443/4321/3000`, it isn't env-substituted).
    ports:
      - ${HOST_HTTP_PORT:-80}:${NGINX_PORT:-80}
      - ${HOST_HTTPS_PORT:-443}:443
      - ${HOST_PROXY_PORT_4321:-4321}:4321
      - ${HOST_PROXY_PORT_3000:-3000}:3000
      - ${HOST_PROXY_PORT_3002:-3002}:3002
    depends_on:
      - webapp
      - server
      - shop
      - minio
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - node_network

  dbPostgres:
    image: postgres:18.4
    # Bound to loopback only — not exposed on external interfaces (security rule).
    # Host port overridable via HOST_POSTGRES_PORT (see scripts/star-from-cero.sh).
    ports:
      - 127.0.0.1:${HOST_POSTGRES_PORT:-5432}:5432
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql:rw
    container_name: dbPostgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - node_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # GO-LIVE: stock redis:7-alpine defaults have NO maxmemory limit and NO
    # eviction policy — unbounded growth until something else breaks. Real
    # values come from .env (REDIS_MAXMEMORY/REDIS_MAXMEMORY_POLICY, see
    # that file's comment for sizing guidance) so they can be tuned per
    # environment without editing this file.
    command:
      [
        "redis-server",
        "--maxmemory",
        "${REDIS_MAXMEMORY:-256mb}",
        "--maxmemory-policy",
        "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}",
      ]
    # Loopback-only host binding; reachable as redis://redis:6379 inside the network.
    # Host port overridable via HOST_REDIS_PORT (see scripts/star-from-cero.sh).
    ports:
      - 127.0.0.1:${HOST_REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    networks:
      - node_network

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      # Enables MinIO's own built-in Prometheus metrics endpoints
      # (/minio/v2/metrics/cluster, /minio/v2/metrics/bucket — real storage
      # usage for the image-assets bucket, not the telemetry one) without
      # requiring a separate service-account JWT. Safe here specifically
      # because port 9000 is already internal-only (no host port, see
      # `expose` below) — "public" only means "no extra auth on top of
      # already not being reachable outside node_network", not actually
      # public to the LAN. See CLAUDE-IMPLEMENT-OPTOMETRY-DASHBOARD-FOR-
      # THE-SYSTEM.md §13.4 for the dashboard this feeds.
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    # S3 API (9000) is internal only, reached by `server` as http://minio:9000
    # (same "no host port" pattern as `server` itself). Web console (9001) is
    # loopback-only for admin access, not exposed publicly.
    # Host port overridable via HOST_MINIO_CONSOLE_PORT (see scripts/star-from-cero.sh).
    ports:
      - 127.0.0.1:${HOST_MINIO_CONSOLE_PORT:-9001}:9001
    expose:
      - "9000"
    command: server /data --console-address ":9001"
    # NAS-backed, not the local minio-data volume (kept below, unused, in
    # case of rollback). MinIO doesn't officially support CIFS/NFS backing
    # storage — accepted risk, see CLAUDE-IMPLEMENT-OPTOMETRY-DASHBOARD-
    # FOR-THE-SYSTEM.md §2.6 (2026-08-06). Existing data (blablarags-apparel
    # + telemetry-logs, ~1.2GB) was migrated here via rsync before the cutover.
    volumes:
      - ${MINIO_DATA_NAS_DIR:-/mnt/junglenas/logs/minio-data}:/data
    networks:
      - node_network

  server:
    image: node:22-alpine
    working_dir: /usr/src/server
    restart: unless-stopped
    # Parameterized (not a hardcoded "./.env") so `docker compose --env-file
    # .env.presentation up` actually takes effect here too — --env-file only
    # controls ${VAR} interpolation in this YAML, it does NOT change what an
    # env_file: directive loads into the container at runtime. Without this,
    # presentation mode still booted the server against the real .env and it
    # crashed on ALLOW_LOCAL_LOG_DIR=false (found + fixed 2026-08-07 — see
    # README_RUN_PRESENTATION.md).
    env_file:
      - ${SERVER_ENV_FILE:-./.env}
    environment:
      - NODE_ENV=development
      - DB_HOST=dbPostgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HOST=0.0.0.0
      - PORT=5000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-blablarags-apparel}
    # Internal only — nginx reverse-proxies to it as http://server:5000. No host port.
    expose:
      - "5000"
    # Runtime install (mirrors webapp), then start the Fastify API.
    command: sh -c "npm install --ignore-scripts && npm start"
    volumes:
      - ./server:/usr/src/server
      - server_node_modules:/usr/src/server/node_modules
      # NAS-backed telemetry log dir — see
      # CLAUDE-IMPLEMENT-OPTOMETRY-DASHBOARD-FOR-THE-SYSTEM.md §2.6/§5.5.
      # logger.ts refuses to start file logging if this doesn't resolve to a
      # real network filesystem (unless ALLOW_LOCAL_LOG_DIR=true), so a
      # dropped NAS mount fails loudly at container start instead of
      # silently writing logs to this bind mount's local fallback content.
      - ${TELEMETRY_LOG_NAS_DIR:-/mnt/junglenas/logs/node-nginx-clean-server}:/usr/src/server/logs
    depends_on:
      - dbPostgres
      - redis
      - minio
      - mailhog
    networks:
      - node_network

  # Public storefront (Next.js App Router) — replaces the Astro coming-soon
  # site as the real product. Calls the same Fastify API server as the
  # mobile app, over the JWT-bearer surface (not the dashboard's session
  # cookie) — see BLABLARAGS-SYSTEM-ANALISIS-FULL-SUITE.md §3-4.
  #
  # Not exposed to the host directly (same convention as `webapp`) — real
  # access, including TLS, goes through nginx's `listen 3002 ssl` server
  # block in nginx/default.conf, matching every other frontend in this
  # stack. `next dev` binds 0.0.0.0:3002 so nginx can reach it on the
  # docker network, but plain-HTTP 3002 is never published to the host.
  shop:
    container_name: shop
    image: node:22-alpine
    working_dir: /usr/src/shop
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3002
      # Dev-only: next.config.ts rewrites relative /api/* calls here so the
      # same client code works whether nginx is in front (prod) or not (dev
      # convenience, e.g. curling the container directly).
      - API_PROXY_TARGET=http://server:5000
      # next.config.ts extracts this URL's hostname to build Next 16's
      # `allowedDevOrigins` — see that file's comment. Same dynamically-
      # updated LAN IP the server/webapp already use, not hardcoded here.
      - MINIO_PUBLIC_URL_BASE=${MINIO_PUBLIC_URL_BASE:-}
    command: sh -c "npm install --ignore-scripts && npm run dev"
    volumes:
      - ./shop:/usr/src/shop
      - shop_node_modules:/usr/src/shop/node_modules
    depends_on:
      - server
    networks:
      - node_network

  # Coming-soon marketing site (Astro) — local dev preview only. Production
  # deploys to Cloudflare Workers (www.blablarags.com) via Cloudflare's
  # GitHub-connected Workers Builds, not this container — see
  # website/webs-01-comming-soon_v1.md. Deliberately NOT wired into
  # nginx/default.conf: different domain/audience than webapp-node.io (the
  # internal admin/API domain the rest of this stack serves).
  # NOTE: uses the glibc `node:22` image, not `node:22-alpine` (unlike this
  # stack's other plain-image services) — Cloudflare's `workerd` runtime
  # (needed by `astro build`'s prerender step and `wrangler dev`, both run
  # inside this container per the "everything through Docker" convention)
  # ships musl-incompatible binaries. See webs-01-comming-soon_v1.md §9.
  website:
    image: node:22
    container_name: website
    working_dir: /usr/src/website
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=4322
      # Non-interactive wrangler auth — see .env's own comment for why not
      # `wrangler login` (browser-OAuth-inside-Docker doesn't work).
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    # Host port overridable via HOST_WEBSITE_PORT (see scripts/star-from-cero.sh).
    ports:
      - ${HOST_WEBSITE_PORT:-4322}:4322
    # `rm -f .astro/dev.json` before every start: astro dev writes a
    # root-owned PID lock there, into the bind-mounted host dir. Any
    # non-graceful stop (restart/recreate/SIGKILL) leaves it stale, and the
    # next start then refuses with "Another astro dev server is already
    # running" — self-heals here instead of needing a manual `docker
    # compose run --rm website rm -f .astro/dev.json` every time (hit this
    # 3x before adding the fix — see webs-01-comming-soon_v1.md §11).
    command: sh -c "npm install --ignore-scripts && rm -f .astro/dev.json && npm run dev -- --host 0.0.0.0 --port 4322"
    volumes:
      - ./website:/usr/src/website
      - website_node_modules:/usr/src/website/node_modules
    networks:
      - node_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    # SMTP catcher for SmtpEmailService (system_settings smtp.host=mailhog,
    # smtp.port=1025, see db/migrations/0020_system_settings.sql) — internal
    # only, reached by `server` as mailhog:1025.
    expose:
      - "1025"
    # Web UI to inspect caught mail — loopback-only, same pattern as the
    # minio console (security rule: no admin UI exposed on a public interface).
    # Host port overridable via HOST_MAILHOG_PORT (see scripts/star-from-cero.sh).
    ports:
      - 127.0.0.1:${HOST_MAILHOG_PORT:-8025}:8025
    networks:
      - node_network

