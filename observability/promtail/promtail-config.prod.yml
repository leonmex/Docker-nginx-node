# Production variant of promtail-config.yml — identical pipeline (same
# pino JSON schema, same label set), just reading from a local EC2 disk
# path instead of the NAS path used in dev (no NAS on EC2 — server writes
# to a plain bind-mounted directory instead, LOG_OUTPUT=both,
# ALLOW_LOCAL_LOG_DIR=true — see docker-compose.prod.yml's server service).

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: node-nginx-clean-server
    static_configs:
      - targets: [localhost]
        labels:
          job: node-nginx-clean-server
          __path__: /var/log/telemetry/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            module: module
            time: time
      - labels:
          level:
          service:
          module:
      - timestamp:
          source: time
          format: RFC3339Nano
