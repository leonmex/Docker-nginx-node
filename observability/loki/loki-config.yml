# Loki storage backend: the EXISTING `minio` service's S3 API, bucket
# `telemetry-logs` (created by the `minio-init-telemetry-bucket` one-shot
# service in docker-compose.observability.yml before Loki starts). As of
# 2026-08-06, MinIO's own data directory (root docker-compose.yml's `minio`
# service) is itself NAS-backed (${MINIO_DATA_NAS_DIR}, default
# /mnt/junglenas/logs/minio-data) — a deliberate, risk-accepted change (see
# plan §2.6): MinIO doesn't officially support CIFS/NFS backing storage (no
# guaranteed atomic rename/flock), validated live before relying on it, not
# discovered for the first time in production. `telemetry-logs`, therefore,
# effectively already lives on the NAS via that path, one level down
# (${MINIO_DATA_NAS_DIR}/telemetry-logs). `server/scripts/ops/backup-
# telemetry-bucket-to-nas.sh` (mirrors to a SEPARATE NAS path, still not
# cron-scheduled) is now a true second copy on top of that, not the only
# NAS-touching piece.
#
# This is the same architecture a real Kubernetes deployment would use
# against a real S3 bucket — only the endpoint changes at migration time.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  aws:
    endpoint: minio:9000
    bucketnames: telemetry-logs
    region: us-east-1
    access_key_id: ${MINIO_ROOT_USER}
    secret_access_key: ${MINIO_ROOT_PASSWORD}
    s3forcepathstyle: true
    insecure: true
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  # Dev/staging-sized defaults — revisit before this ever points at a
  # production log volume (see plan §10 open question #2).
  retention_period: 360h # 15 days, matches Prometheus's proposed retention
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3

analytics:
  reporting_enabled: false
