apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Lets a Loki log line with a matching reqId jump to... nothing yet
      # (no tracing backend exists — see plan §9 Phase 5). Left unset
      # deliberately rather than wired to a backend that doesn't exist.
      maxLines: 1000
