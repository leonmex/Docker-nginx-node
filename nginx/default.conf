   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }
}

# HTTPS server - Port 3002 - public storefront (Next.js "shop")
server {
 listen 3002 ssl;
 listen [::]:3002 ssl;
 server_name webapp-node.io;

 ssl_certificate /etc/nginx/certs/server.crt;
 ssl_certificate_key /etc/nginx/certs/server.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_ciphers HIGH:!aNULL:!MD5;

 # Redirect HTTP requests on the HTTPS port to HTTPS
 error_page 497 https://$host:3002$request_uri;

 # Same /api/* surface as the other server blocks — the shop's client code
 # calls relative `/api/v1/...` paths, same-origin, exactly like the
 # dashboard does. See the 443 server block's matching locations for the
 # full rationale on the rate-limit/no-rate-limit split.
 location /api/health {
   proxy_pass http://server:5000;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
 }

 location ~ ^/api/(accounts(/verify(/resend)?|/refresh)?|login/account)$ {
   limit_req zone=api_strict burst=30 nodelay;
   proxy_pass http://server:5000;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
 }

 location /api/ {
   limit_req zone=api_general burst=60 nodelay;
   proxy_pass http://server:5000;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection 'upgrade';
   proxy_set_header Host $host;
   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }

 # Public apparel image storage — same as the main server block.
 location /media/ {
   proxy_pass http://minio:9000/;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }

 location / {
   proxy_pass http://shop:3002;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection 'upgrade';
   proxy_set_header Host $host;
   proxy_cache_bypass $http_upgrade;
   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }
}
