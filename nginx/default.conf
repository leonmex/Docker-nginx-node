# HTTP server - redirect all traffic to HTTPS (port 443)
server {
 listen 80 default_server;
 listen [::]:80 default_server;
 server_name webapp-node.io;
 return 301 https://$host$request_uri;
}

# HTTPS server - main server for webapp and api
server {
 listen 443 ssl default_server;
 listen [::]:443 ssl default_server;
 server_name webapp-node.io;

 ssl_certificate /etc/nginx/certs/server.crt;
 ssl_certificate_key /etc/nginx/certs/server.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_ciphers HIGH:!aNULL:!MD5;

 # Redirect HTTP requests on the HTTPS port to HTTPS
 error_page 497 https://$host$request_uri;

 location /api/ {
   proxy_pass http://server:5000;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection 'upgrade';
   proxy_set_header Host $host;
   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }

 # Public apparel image storage
 location /media/ {
   proxy_pass http://minio:9000/;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }

 location / {
   proxy_pass http://webapp:3000;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection 'upgrade';
   proxy_set_header Host $host;
   proxy_cache_bypass $http_upgrade;
   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }

 location /new {
   proxy_pass http://webapp:3001;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection 'upgrade';
   proxy_set_header Host $host;
   proxy_cache_bypass $http_upgrade;
 }

 location ~ /.well-known {
   allow all;
 }

 client_max_body_size 100m;
}

