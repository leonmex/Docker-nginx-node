server {
 listen 80;
 listen [::]:80;
 server_name webapp-node.io;


 location /api/ {
   proxy_pass http://server:5000;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection 'upgrade';
   proxy_set_header Host $host;
   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }


 # Public apparel image storage (Blablarags mobile app — Section 4 of
 # project_migrate_endpoints_to_server_v1.md). Trailing slash on BOTH
 # proxy_pass and this location strips the /media/ prefix, so
 # http://host/media/<bucket>/<key> -> http://minio:9000/<bucket>/<key>,
 # matching MinioObjectStorage's public-read bucket + MINIO_PUBLIC_URL_BASE.
 location /media/ {
   proxy_pass http://minio:9000/;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }


 location / {
   proxy_pass http://webapp:3000;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection 'upgrade';
   proxy_set_header Host $host;
   proxy_cache_bypass $http_upgrade;
   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }


 location /new {
   proxy_pass http://webapp:3001;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection 'upgrade';
   proxy_set_header Host $host;
   proxy_cache_bypass $http_upgrade;
 }


 location ~ /.well-known {
   allow all;
 }


 # Raised from 6m: apparel group uploads are multipart (multiple JPEG crops
 # per request, each up to config.multipartMaxFileSizeBytes = 15MB on the
 # Fastify side) — 6m would reject those at the proxy before they ever reach
 # the server. Tune based on real photo sizes/observed group sizes.
 client_max_body_size 100m;
}


server {
 listen 4321;
 listen [::]:4321;
 server_name webapp-node.io;


 location / {
   proxy_pass http://webapp:4321;
   proxy_http_version 1.1;
