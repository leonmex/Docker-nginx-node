# Rate-limit zones for /api/* — sandbox-phase values (loose, so manual QA and
# smoke-test scripts aren't throttled). Tighten before production: api_strict
# to 2r/s (burst 5), api_general to 10r/s (burst 20) — see
# proxy_hardening_and_public_access_proposal.md §2.1/§2.0 for the full
# endpoint-to-zone assignment and rationale.
#
# /api/admin/* is deliberately NOT rate-limited at all (see its `location`
# block below) — the dashboard is a trusted internal admin tool that cangrad
# legitimately fire thousands of requests auditing/checking user and mobile
# accounts in bulk, and every route under it already requires a valid
# dashboard session cookie before doing anything (requireAdmin()). The auth
# gate is the real defense there; any fixed rate ceiling either breaks a
# real bulk admin operation or is set so high it protects against nothing.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_strict:10m rate=10r/s;

# HTTP server - redirect all traffic to HTTPS (port 443)
server {
 listen 80 default_server;
 listen [::]:80 default_server;
 server_name webapp-node.io;
 return 301 https://$host$request_uri;
}

# HTTPS server - main server for webapp and api
server {
 listen 443 ssl default_server;
 listen [::]:443 ssl default_server;
 server_name webapp-node.io;

 ssl_certificate /etc/nginx/certs/server.crt;
 ssl_certificate_key /etc/nginx/certs/server.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_ciphers HIGH:!aNULL:!MD5;

 # Docker's embedded DNS — required so the /grafana/ location below resolves
 # its upstream lazily, per-request, instead of once at startup (see that
 # location's comment for why).
 resolver 127.0.0.11 valid=10s;

 # Redirect HTTP requests on the HTTPS port to HTTPS
 error_page 497 https://$host$request_uri;

 # Liveness check — never rate-limited.
 location /api/health {
   proxy_pass http://server:5000;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
 }

 # Unauthenticated auth-entry routes (registration, verify, refresh, login) —
 # the ones a credential-stuffing/OTP-guessing/spam attempt would target.
 location ~ ^/api/(accounts(/verify(/resend)?|/refresh)?|login/account)$ {
   limit_req zone=api_strict burst=30 nodelay;
   proxy_pass http://server:5000;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
 }

 # Dashboard admin routes — NOT rate-limited (see the comment at the top of
 # this file): already session-cookie-gated (requireAdmin()), and this is a
 # trusted internal tool that legitimately does bulk account auditing.
 location /api/admin/ {
   proxy_pass http://server:5000;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
 }

 location /api/ {
   limit_req zone=api_general burst=60 nodelay;
   proxy_pass http://server:5000;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection 'upgrade';
   proxy_set_header Host $host;
   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }

 # Public apparel image storage
 location /media/ {
   proxy_pass http://minio:9000/;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }

 # Grafana (docker-compose.observability.yml — opt-in, only resolves when
 # that stack is up). Auth is Grafana's own login (GF_USERS_ALLOW_SIGN_UP=
 # false, no anonymous access) — this route just makes it LAN-reachable
 # instead of loopback-only; deliberately added as its own location rather
 # than left to fall through to a catch-all, learning from the earlier
 # /dev/turbopack-cache-size incident where an unauthenticated dev route
 # became accidentally LAN-reachable through nginx's routing rules. Rate
 # limited via the same api_general zone as the rest of this file.
 location /grafana/ {
   limit_req zone=api_general burst=60 nodelay;
   # A variable (not a bare hostname) forces the `resolver` above to be used,
   # deferring DNS lookup to request time — otherwise nginx resolves
   # "grafana" once at startup and refuses to start at all when the
   # observability stack isn't up, defeating the whole point of this route
   # being opt-in. Returns 502 until docker-compose.observability.yml is
   # running, instead of taking the entire proxy down.
   set $grafana_upstream http://grafana:3000;
   proxy_pass $grafana_upstream/grafana/;
   proxy_http_version 1.1;
   proxy_set_header Host $host;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection 'upgrade';
   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }

 location / {
   proxy_pass http://webapp:3000;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection 'upgrade';
   proxy_set_header Host $host;
   proxy_cache_bypass $http_upgrade;
   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }

 location /new {
   proxy_pass http://webapp:3001;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection 'upgrade';
   proxy_set_header Host $host;
   proxy_cache_bypass $http_upgrade;
 }

 location ~ /.well-known {
   allow all;
 }

 client_max_body_size 100m;
}

# HTTPS server - Port 4321
server {
 listen 4321 ssl;
 listen [::]:4321 ssl;
 server_name webapp-node.io;

 ssl_certificate /etc/nginx/certs/server.crt;
 ssl_certificate_key /etc/nginx/certs/server.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_ciphers HIGH:!aNULL:!MD5;

 # Redirect HTTP requests on the HTTPS port to HTTPS
 error_page 497 https://$host:4321$request_uri;

 location / {
   proxy_pass http://webapp:4321;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection 'upgrade';
   proxy_set_header Host $host;
   proxy_cache_bypass $http_upgrade;
   proxy_read_timeout 86400s;
   proxy_send_timeout 86400s;
 }
}

