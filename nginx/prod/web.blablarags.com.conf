# web.blablarags.com — Next.js "shop" storefront. Pre-launch gate: Basic
# Auth on the storefront itself (location /) — one prompt at the front
# door. Credentials from SECRETES/Basic-Auth/users-access.md, fetched from
# Secrets Manager (blablarags-prod-nginx-basic-auth) by the EC2 deploy
# script into /etc/nginx/secrets/.htpasswd on every deploy — never
# committed.
#
# The /api/* locations below deliberately turn `auth_basic off` — real
# incident 2026-08-19: shop's client-side fetch()/XHR calls (cart, account
# refresh, etc.) can't answer an interactive Basic Auth challenge the way a
# top-level navigation can, so nginx's auth_basic silently 401'd every
# background API call even after the user had already authenticated for
# the page itself (confirmed via repeated 401s in Loki with no
# corresponding successful retry, e.g. /api/v1/cart). Same reasoning
# already applied to api.blablarags.com.conf itself (never gets
# auth_basic, see its own header comment) — these locations just proxy to
# that same backend under a different path prefix, so they need the same
# exemption. The real API's own JWT/session auth is what actually protects
# these endpoints; the nginx Basic Auth here is only a pre-launch
# "keep random visitors off the storefront" gate, not a second security
# layer for the API itself.
#
# shop runs on its OWN EC2 instance, separate from server/dashboard (higher,
# more public traffic — isolated for performance/blast-radius reasons). The
# /api/* locations below proxy to the real public api.blablarags.com, not a
# local docker-network hostname — there is no `server` container on this
# instance at all. Host header is set explicitly to api.blablarags.com (not
# $host, which would be "web.blablarags.com" and fail that origin's own
# server_name matching); proxy_ssl_server_name sends the matching SNI.

server {
  listen 80;
  listen [::]:80;
  server_name web.blablarags.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name web.blablarags.com;

  ssl_certificate /etc/nginx/certs/cloudflare_origin.crt;
  ssl_certificate_key /etc/nginx/certs/cloudflare_origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  error_page 497 https://$host$request_uri;

  auth_basic "blablarags — restricted (pre-launch)";
  auth_basic_user_file /etc/nginx/secrets/.htpasswd;

  # Variables, not bare hostnames — see 00-shared.conf's `resolver`
  # comment. Applies here too even though api_upstream is a real public
  # domain, not a docker service name — Docker's embedded DNS forwards
  # external lookups to the host's own resolvers.
  set $api_upstream api.blablarags.com;
  set $shop_upstream shop;

  location /api/health {
    auth_basic off;
    proxy_pass https://$api_upstream;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host api.blablarags.com;
  }

  location ~ ^/api/(accounts(/verify(/resend)?|/refresh)?|login/account)$ {
    auth_basic off;
    limit_req zone=api_strict burst=5 nodelay;
    proxy_pass https://$api_upstream;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host api.blablarags.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    auth_basic off;
    limit_req zone=api_general burst=20 nodelay;
    proxy_pass https://$api_upstream;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host api.blablarags.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Product images/docs — Cloudflare R2, not proxied through this origin
  # (see server/docs/trade-off-v2-devops-review.md Finding #8) — shop reads
  # CDN_BASE_URL directly, no /media/ location needed here.

  # Same auth_basic-off reasoning as the /api/ locations above — the
  # browser's own service-worker registration (navigator.serviceWorker.
  # register('/sw.js')) and PWA manifest lookup are background fetches,
  # not interactive navigation, so they can't answer a Basic Auth
  # challenge either. Neither file is sensitive.
  location = /sw.js {
    auth_basic off;
    proxy_pass http://$shop_upstream:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /manifest.json {
    auth_basic off;
    proxy_pass http://$shop_upstream:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://$shop_upstream:3002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  client_max_body_size 25m;
}
