# grafana.blablarags.com — observability dashboards (Prometheus + Loki
# metrics/logs). Two auth layers, same pattern as admin.blablarags.com:
# nginx Basic Auth as the outer pre-launch gate (same htpasswd/credentials
# as web/admin), then Grafana's own separate login on top — see
# SECRETES/GRAFANA-ACCESS.md.
#
# Runs on the app instance (server+dashboard) — see docker-compose.prod.yml.

server {
  listen 80;
  listen [::]:80;
  server_name grafana.blablarags.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name grafana.blablarags.com;

  ssl_certificate /etc/nginx/certs/cloudflare_origin.crt;
  ssl_certificate_key /etc/nginx/certs/cloudflare_origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  error_page 497 https://$host$request_uri;

  auth_basic "blablarags — restricted (pre-launch)";
  auth_basic_user_file /etc/nginx/secrets/.htpasswd;

  # Variable, not a bare hostname — see 00-shared.conf's `resolver`
  # comment. This exact config was the one that took down api/admin too
  # during the 2026-08-18 resize, since a single unresolvable static
  # proxy_pass crashes nginx's entire process, not just this domain.
  set $grafana_upstream grafana;

  location / {
    proxy_pass http://$grafana_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  client_max_body_size 10m;
}
