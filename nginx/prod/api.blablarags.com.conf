# api.blablarags.com — Fastify server. Deliberately NO basic auth (the
# mobile app hits this domain directly and can't handle an auth_basic
# prompt) — see server/docs/DEPLOY-CICD-PLAN-EC2-GHCR-OK.md.

server {
  listen 80;
  listen [::]:80;
  server_name api.blablarags.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name api.blablarags.com;

  # Cloudflare Origin CA certificate — see server/docs/
  # trade-off-v2-devops-review.md Finding #3: nginx/certs/ must be gitignored
  # (fixed) before the real cert/key land here.
  ssl_certificate /etc/nginx/certs/cloudflare_origin.crt;
  ssl_certificate_key /etc/nginx/certs/cloudflare_origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  error_page 497 https://$host$request_uri;

  location /api/health {
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/(accounts(/verify(/resend)?|/refresh)?|login/account)$ {
    limit_req zone=api_strict burst=5 nodelay;
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/admin/ {
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api_general burst=20 nodelay;
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location ~* /(\.env|\.git|wp-admin|phpmyadmin) {
    return 404;
  }

  client_max_body_size 25m;
}
