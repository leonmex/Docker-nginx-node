# admin.blablarags.com — dashboard (static SPA, served by its own internal
# nginx — see dashboard/Dockerfile — reverse-proxied here as webapp:80).
# Same pre-launch Basic Auth gate as web.blablarags.com; see that file's
# header comment for the credential-flow details.

server {
  listen 80;
  listen [::]:80;
  server_name admin.blablarags.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name admin.blablarags.com;

  ssl_certificate /etc/nginx/certs/cloudflare_origin.crt;
  ssl_certificate_key /etc/nginx/certs/cloudflare_origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  error_page 497 https://$host$request_uri;

  auth_basic "blablarags — restricted (pre-launch)";
  auth_basic_user_file /etc/nginx/secrets/.htpasswd;

  # Variables, not bare hostnames — see 00-shared.conf's `resolver` comment.
  set $server_upstream server;
  set $webapp_upstream webapp;

  location /api/health {
    proxy_pass http://$server_upstream:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location ~ ^/api/(accounts(/verify(/resend)?|/refresh)?|login/account)$ {
    limit_req zone=api_strict burst=5 nodelay;
    proxy_pass http://$server_upstream:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/admin/ {
    proxy_pass http://$server_upstream:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api_general burst=20 nodelay;
    proxy_pass http://$server_upstream:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location / {
    proxy_pass http://$webapp_upstream:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  client_max_body_size 25m;
}
