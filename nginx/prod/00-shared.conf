# Shared http{}-level directives for all 3 production domains (api/web/admin
# .blablarags.com) — loaded first (00- prefix) since set_real_ip_from and
# limit_req_zone must live outside any server{} block, and every server{}
# file in this directory references the zones defined here.
#
# Cloudflare real-IP restoration: without this, every request's source IP is
# Cloudflare's edge, not the real client — see server/docs/
# trade-off-v2-devops-review.md and server/devops/README.md's "Known gap:
# rate limits are one shared global bucket" for why this matters (rate
# limiting and audit logs are meaningless without it). List sourced from
# Cloudflare's published ranges (cloudflare.com/ips-v4, /ips-v6) — these can
# change; re-fetch periodically rather than trusting this list indefinitely
# (flagged as a known staleness risk in the trade-off review, Finding #9).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Same production thresholds nginx/default.conf's own top comment already
# flagged as the pre-production target (tighter than the loose sandbox-phase
# dev values) — see proxy_hardening_and_public_access_proposal.md §2.1/§2.0.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_strict:10m rate=2r/s;
